<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Golf Bets">
    <title>Golf Bet Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gradient-to-br from-green-800 to-green-600 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function GolfBetTracker() {
          const [screen, setScreen] = useState('home');
          const [savedPlayers, setSavedPlayers] = useState([]);
          const [savedCourses, setSavedCourses] = useState([]);
          const [gameHistory, setGameHistory] = useState([]);
          
          // Manage Players state
          const [newPlayerName, setNewPlayerName] = useState('');
          const [newPlayerHcp, setNewPlayerHcp] = useState('');
          
          // Manage Courses state
          const [newCourseName, setNewCourseName] = useState('');
          const [newCourseHcp, setNewCourseHcp] = useState('1,3,5,7,9,11,13,15,17,2,4,6,8,10,12,14,16,18');
          const [newCoursePars, setNewCoursePars] = useState('4,4,3,5,4,4,3,4,5,4,4,3,5,4,4,3,4,5');
          
          const [gameState, setGameState] = useState({
            matchPlay: {
              team1: [],
              team2: [],
              bets: { front: 5, back: 5, total: 5 },
              holeHandicaps: [],
              holePars: [],
              courseName: '',
              scores: Array(18).fill(null).map(() => ({
                team1: [null, null],
                team2: [null, null]
              })),
              currentHole: 1
            }
          });

          const [setupData, setSetupData] = useState({
            team1player1: '',
            team1player1hcp: '',
            team1player2: '',
            team1player2hcp: '',
            team2player1: '',
            team2player1hcp: '',
            team2player2: '',
            team2player2hcp: '',
            betFront: '5',
            betBack: '5',
            betTotal: '5',
            courseName: '',
            holeHandicaps: '1,3,5,7,9,11,13,15,17,2,4,6,8,10,12,14,16,18',
            holePars: '4,4,3,5,4,4,3,4,5,4,4,3,5,4,4,3,4,5'
          });

          // Load saved data on mount
          useEffect(() => {
            const players = localStorage.getItem('golfPlayers');
            const courses = localStorage.getItem('golfCourses');
            const history = localStorage.getItem('golfGameHistory');
            if (players) setSavedPlayers(JSON.parse(players));
            if (courses) setSavedCourses(JSON.parse(courses));
            if (history) setGameHistory(JSON.parse(history));
          }, []);

          const savePlayer = (name, hcp) => {
            if (!name) return;
            const existing = savedPlayers.find(p => p.name === name);
            let updated;
            if (existing) {
              updated = savedPlayers.map(p => p.name === name ? { name, hcp: parseFloat(hcp) } : p);
            } else {
              updated = [...savedPlayers, { name, hcp: parseFloat(hcp) }];
            }
            setSavedPlayers(updated);
            localStorage.setItem('golfPlayers', JSON.stringify(updated));
          };

          const saveCourse = (courseName, holeHandicaps, pars) => {
            if (!courseName) return;
            const existing = savedCourses.find(c => c.name === courseName);
            let updated;
            if (existing) {
              updated = savedCourses.map(c => c.name === courseName ? { name: courseName, holeHandicaps, pars } : c);
            } else {
              updated = [...savedCourses, { name: courseName, holeHandicaps, pars }];
            }
            setSavedCourses(updated);
            localStorage.setItem('golfCourses', JSON.stringify(updated));
          };

          const handlePlayerSelect = (field, hcpField, playerName) => {
            if (playerName === '__new__') {
              setSetupData({...setupData, [field]: '', [hcpField]: ''});
            } else if (playerName) {
              const player = savedPlayers.find(p => p.name === playerName);
              if (player) {
                setSetupData({...setupData, [field]: playerName, [hcpField]: player.hcp.toString()});
              }
            }
          };

          const handleCourseSelect = (courseName) => {
            if (courseName === '__new__') {
              // Clear for new course
              setSetupData({...setupData, courseName: '', holeHandicaps: '1,3,5,7,9,11,13,15,17,2,4,6,8,10,12,14,16,18', holePars: '4,4,3,5,4,4,3,4,5,4,4,3,5,4,4,3,4,5'});
            } else if (courseName) {
              const course = savedCourses.find(c => c.name === courseName);
              if (course) {
                setSetupData({
                  ...setupData, 
                  courseName, 
                  holeHandicaps: course.holeHandicaps.join(','),
                  holePars: course.pars ? course.pars.join(',') : '4,4,3,5,4,4,3,4,5,4,4,3,5,4,4,3,4,5'
                });
              }
            }
          };

          const startMatchPlay = () => {
            const team1 = [
              { name: setupData.team1player1, hcp: parseFloat(setupData.team1player1hcp) },
              { name: setupData.team1player2, hcp: parseFloat(setupData.team1player2hcp) }
            ];
            const team2 = [
              { name: setupData.team2player1, hcp: parseFloat(setupData.team2player1hcp) },
              { name: setupData.team2player2, hcp: parseFloat(setupData.team2player2hcp) }
            ];

            if (!team1[0].name || !team1[1].name || !team2[0].name || !team2[1].name) {
              alert('Please enter all player names');
              return;
            }

            savePlayer(setupData.team1player1, setupData.team1player1hcp);
            savePlayer(setupData.team1player2, setupData.team1player2hcp);
            savePlayer(setupData.team2player1, setupData.team2player1hcp);
            savePlayer(setupData.team2player2, setupData.team2player2hcp);

            const bets = {
              front: parseFloat(setupData.betFront) || 5,
              back: parseFloat(setupData.betBack) || 5,
              total: parseFloat(setupData.betTotal) || 5
            };

            const holeHandicaps = setupData.holeHandicaps.split(',').map(h => parseInt(h.trim()));
            if (holeHandicaps.length !== 18) {
              alert('Please enter exactly 18 hole handicaps');
              return;
            }

            const holePars = setupData.holePars.split(',').map(h => parseInt(h.trim()));
            if (holePars.length !== 18) {
              alert('Please enter exactly 18 hole pars');
              return;
            }

            // Save course if named
            if (setupData.courseName) {
              saveCourse(setupData.courseName, holeHandicaps, holePars);
            }

            setGameState({
              matchPlay: {
                team1,
                team2,
                bets,
                holeHandicaps,
                holePars,
                courseName: setupData.courseName,
                scores: Array(18).fill(null).map(() => ({
                  team1: [null, null],
                  team2: [null, null]
                })),
                currentHole: 1
              }
            });

            setScreen('scoring');
          };

          const calculateNetScore = (grossScore, hcp, holeHcp, lowestHcp) => {
            if (grossScore === null || grossScore === '') return null;
            const strokesNeeded = Math.round(hcp - lowestHcp);
            const getsStroke = strokesNeeded >= holeHcp ? 1 : 0;
            return grossScore - getsStroke;
          };

          const getPlayerStrokes = (playerHcp, lowestHcp) => {
            return Math.round(playerHcp - lowestHcp);
          };

          const getStrokeHoles = (strokes, holeHandicaps) => {
            if (strokes === 0) return [];
            return holeHandicaps.map((hcp, idx) => strokes >= hcp ? idx + 1 : null).filter(h => h !== null);
          };

          const getHoleWinner = (hole) => {
            const mp = gameState.matchPlay;
            const scores = mp.scores[hole];
            
            if (!scores.team1[0] || !scores.team1[1] || !scores.team2[0] || !scores.team2[1]) {
              return null;
            }

            const allPlayers = [...mp.team1, ...mp.team2];
            const lowestHcp = Math.min(...allPlayers.map(p => p.hcp));
            const holeHcp = mp.holeHandicaps[hole];

            const team1Net = [
              calculateNetScore(scores.team1[0], mp.team1[0].hcp, holeHcp, lowestHcp),
              calculateNetScore(scores.team1[1], mp.team1[1].hcp, holeHcp, lowestHcp)
            ];
            const team2Net = [
              calculateNetScore(scores.team2[0], mp.team2[0].hcp, holeHcp, lowestHcp),
              calculateNetScore(scores.team2[1], mp.team2[1].hcp, holeHcp, lowestHcp)
            ];

            const team1Best = Math.min(...team1Net);
            const team2Best = Math.min(...team2Net);

            if (team1Best < team2Best) return 'team1';
            if (team2Best < team1Best) return 'team2';
            return 'tie';
          };

          const getMatchStatus = () => {
            let frontTeam1 = 0, frontTeam2 = 0;
            let backTeam1 = 0, backTeam2 = 0;
            let totalTeam1 = 0, totalTeam2 = 0;

            for (let i = 0; i < 18; i++) {
              const winner = getHoleWinner(i);
              if (winner === 'team1') {
                totalTeam1++;
                if (i < 9) frontTeam1++;
                else backTeam1++;
              } else if (winner === 'team2') {
                totalTeam2++;
                if (i < 9) frontTeam2++;
                else backTeam2++;
              }
            }

            return { frontTeam1, frontTeam2, backTeam1, backTeam2, totalTeam1, totalTeam2 };
          };

          const checkMissingScores = () => {
            const mp = gameState.matchPlay;
            const missing = [];
            
            for (let i = 0; i < 18; i++) {
              if (!mp.scores[i].team1[0]) missing.push(`Hole ${i+1}: ${mp.team1[0].name}`);
              if (!mp.scores[i].team1[1]) missing.push(`Hole ${i+1}: ${mp.team1[1].name}`);
              if (!mp.scores[i].team2[0]) missing.push(`Hole ${i+1}: ${mp.team2[0].name}`);
              if (!mp.scores[i].team2[1]) missing.push(`Hole ${i+1}: ${mp.team2[1].name}`);
            }
            
            return missing;
          };

          const updateScore = (hole, playerIndex, value) => {
            const newGameState = { ...gameState };
            const scoreValue = value === '' ? null : parseInt(value);
            
            if (playerIndex < 2) {
              newGameState.matchPlay.scores[hole].team1[playerIndex] = scoreValue;
            } else {
              newGameState.matchPlay.scores[hole].team2[playerIndex - 2] = scoreValue;
            }
            
            setGameState(newGameState);
          };

          const nextHole = () => {
            if (gameState.matchPlay.currentHole < 18) {
              setGameState({
                ...gameState,
                matchPlay: { ...gameState.matchPlay, currentHole: gameState.matchPlay.currentHole + 1 }
              });
            } else {
              alert('This is the last hole! Click "Finish Round" to see results.');
            }
          };

          const previousHole = () => {
            if (gameState.matchPlay.currentHole > 1) {
              setGameState({
                ...gameState,
                matchPlay: { ...gameState.matchPlay, currentHole: gameState.matchPlay.currentHole - 1 }
              });
            }
          };

          const finishRound = () => {
            const missing = checkMissingScores();
            if (missing.length > 0) {
              const proceed = window.confirm(`Missing scores for:\n${missing.slice(0, 10).join('\n')}${missing.length > 10 ? `\n...and ${missing.length - 10} more` : ''}\n\nProceed anyway?`);
              if (!proceed) return;
            }
            setScreen('results');
          };

          const getPlayerTotals = (playerIdx, teamIdx) => {
            const mp = gameState.matchPlay;
            const allPlayers = [...mp.team1, ...mp.team2];
            const lowestHcp = Math.min(...allPlayers.map(p => p.hcp));
            
            const player = teamIdx === 1 ? mp.team1[playerIdx] : mp.team2[playerIdx];
            
            let frontGross = 0, frontNet = 0, backGross = 0, backNet = 0;
            
            for (let i = 0; i < 18; i++) {
              const gross = teamIdx === 1 ? mp.scores[i].team1[playerIdx] : mp.scores[i].team2[playerIdx];
              if (!gross) continue;
              
              const net = calculateNetScore(gross, player.hcp, mp.holeHandicaps[i], lowestHcp);
              
              if (i < 9) {
                frontGross += gross;
                frontNet += net;
              } else {
                backGross += gross;
                backNet += net;
              }
            }
            
            return {
              frontGross, frontNet,
              backGross, backNet,
              totalGross: frontGross + backGross,
              totalNet: frontNet + backNet
            };
          };

          const addPlayer = () => {
            if (!newPlayerName || !newPlayerHcp) {
              alert('Please enter both name and handicap');
              return;
            }
            savePlayer(newPlayerName, newPlayerHcp);
            setNewPlayerName('');
            setNewPlayerHcp('');
          };

          const deletePlayer = (playerName) => {
            const updated = savedPlayers.filter(p => p.name !== playerName);
            setSavedPlayers(updated);
            localStorage.setItem('golfPlayers', JSON.stringify(updated));
          };

          const editPlayer = (oldName, oldHcp) => {
            const newName = window.prompt('Edit player name:', oldName);
            if (newName === null) return;
            const newHcpInput = window.prompt('Edit handicap:', oldHcp);
            if (newHcpInput === null) return;
            
            const updated = savedPlayers.map(p => 
              p.name === oldName ? { name: newName, hcp: parseFloat(newHcpInput) } : p
            );
            setSavedPlayers(updated);
            localStorage.setItem('golfPlayers', JSON.stringify(updated));
          };

          const addCourse = () => {
            if (!newCourseName) {
              alert('Please enter course name');
              return;
            }
            const holeHandicaps = newCourseHcp.split(',').map(h => parseInt(h.trim()));
            if (holeHandicaps.length !== 18) {
              alert('Please enter exactly 18 hole handicaps');
              return;
            }
            const pars = newCoursePars.split(',').map(h => parseInt(h.trim()));
            if (pars.length !== 18) {
              alert('Please enter exactly 18 hole pars');
              return;
            }
            saveCourse(newCourseName, holeHandicaps, pars);
            setNewCourseName('');
            setNewCourseHcp('1,3,5,7,9,11,13,15,17,2,4,6,8,10,12,14,16,18');
            setNewCoursePars('4,4,3,5,4,4,3,4,5,4,4,3,5,4,4,3,4,5');
          };

          const deleteCourse = (courseName) => {
            const updated = savedCourses.filter(c => c.name !== courseName);
            setSavedCourses(updated);
            localStorage.setItem('golfCourses', JSON.stringify(updated));
          };

          const saveGameToHistory = (gameData) => {
            const newGame = {
              id: Date.now(),
              date: new Date().toISOString(),
              gameType: 'Match Play',
              ...gameData
            };
            const updated = [newGame, ...gameHistory];
            setGameHistory(updated);
            localStorage.setItem('golfGameHistory', JSON.stringify(updated));
          };

          const exportToCSV = () => {
            if (gameHistory.length === 0) {
              alert('No games to export');
              return;
            }

            let csv = 'Date,Game Type,Course,Team 1 Player 1,Team 1 Player 2,Team 2 Player 1,Team 2 Player 2,Front 9 Winner,Back 9 Winner,Total Winner,Team 1 Money,Team 2 Money\n';
            
            gameHistory.forEach(game => {
              const date = new Date(game.date).toLocaleDateString();
              csv += `${date},${game.gameType},${game.courseName || 'N/A'},`;
              csv += `${game.team1[0].name},${game.team1[1].name},${game.team2[0].name},${game.team2[1].name},`;
              csv += `${game.frontWinner},${game.backWinner},${game.totalWinner},`;
              csv += `${game.team1Money},${game.team2Money}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `golf-game-history-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
          };

          const renderScoring = () => {
            const mp = gameState.matchPlay;
            const hole = mp.currentHole - 1;
            
            const allPlayers = [...mp.team1, ...mp.team2];
            const lowestHcp = Math.min(...allPlayers.map(p => p.hcp));
            const strokesNeeded = allPlayers.map(p => getPlayerStrokes(p.hcp, lowestHcp));
            const holeHcp = mp.holeHandicaps[hole];
            
            const playersWithStroke = strokesNeeded.map(strokes => strokes >= holeHcp);

            const status = getMatchStatus();

            return (
              <div className="p-4 max-w-2xl mx-auto">
                <div className="flex gap-2 mb-4">
                  <button 
                    onClick={() => setScreen('scorecard')}
                    className="flex-1 px-3 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700"
                  >
                    View Scorecard
                  </button>
                  <button 
                    onClick={finishRound}
                    className="flex-1 px-3 py-2 bg-green-600 text-white rounded-lg text-sm font-semibold hover:bg-green-700"
                  >
                    Finish Round
                  </button>
                </div>
                
                <h1 className="text-2xl font-bold text-green-800 text-center mb-2">Match Play</h1>
                
                <div className="text-center mb-4">
                  <div className="text-3xl font-bold text-green-800">Hole {mp.currentHole}</div>
                  <div className="text-sm text-gray-700 mt-1">
                    Par {mp.holePars ? mp.holePars[hole] : 4} | Handicap {mp.holeHandicaps[hole]}
                  </div>
                </div>

                <div className="bg-green-50 rounded-lg p-3 mb-3">
                  <div className="flex justify-between items-center mb-2">
                    <h3 className="font-bold text-green-800">Team 1</h3>
                    <div className="text-xs text-gray-600">
                      {mp.team1[0].name}: {strokesNeeded[0]} strokes on holes {getStrokeHoles(strokesNeeded[0], mp.holeHandicaps).join(', ') || 'none'}
                    </div>
                  </div>
                  <div className="text-xs text-gray-600 mb-2 text-right">
                    {mp.team1[1].name}: {strokesNeeded[1]} strokes on holes {getStrokeHoles(strokesNeeded[1], mp.holeHandicaps).join(', ') || 'none'}
                  </div>
                  
                  <div className="mb-2">
                    <div className="flex items-center justify-between">
                      <div className="flex-1">
                        <strong>{mp.team1[0].name}</strong> ({mp.team1[0].hcp})
                        {playersWithStroke[0] && (
                          <div className="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded mt-1 inline-block ml-2">
                            +1 stroke
                          </div>
                        )}
                      </div>
                      <input
                        type="number"
                        value={mp.scores[hole].team1[0] || ''}
                        onChange={(e) => updateScore(hole, 0, e.target.value)}
                        placeholder="Score"
                        className="w-14 px-2 py-1 border-2 border-green-200 rounded text-center text-lg"
                      />
                    </div>
                  </div>

                  <div>
                    <div className="flex items-center justify-between">
                      <div className="flex-1">
                        <strong>{mp.team1[1].name}</strong> ({mp.team1[1].hcp})
                        {playersWithStroke[1] && (
                          <div className="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded mt-1 inline-block ml-2">
                            +1 stroke
                          </div>
                        )}
                      </div>
                      <input
                        type="number"
                        value={mp.scores[hole].team1[1] || ''}
                        onChange={(e) => updateScore(hole, 1, e.target.value)}
                        placeholder="Score"
                        className="w-14 px-2 py-1 border-2 border-green-200 rounded text-center text-lg"
                      />
                    </div>
                  </div>
                </div>

                <div className="bg-orange-50 rounded-lg p-3 mb-3">
                  <div className="flex justify-between items-center mb-2">
                    <h3 className="font-bold text-orange-800">Team 2</h3>
                    <div className="text-xs text-gray-600">
                      {mp.team2[0].name}: {strokesNeeded[2]} strokes on holes {getStrokeHoles(strokesNeeded[2], mp.holeHandicaps).join(', ') || 'none'}
                    </div>
                  </div>
                  <div className="text-xs text-gray-600 mb-2 text-right">
                    {mp.team2[1].name}: {strokesNeeded[3]} strokes on holes {getStrokeHoles(strokesNeeded[3], mp.holeHandicaps).join(', ') || 'none'}
                  </div>
                  
                  <div className="mb-2">
                    <div className="flex items-center justify-between">
                      <div className="flex-1">
                        <strong>{mp.team2[0].name}</strong> ({mp.team2[0].hcp})
                        {playersWithStroke[2] && (
                          <div className="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded mt-1 inline-block ml-2">
                            +1 stroke
                          </div>
                        )}
                      </div>
                      <input
                        type="number"
                        value={mp.scores[hole].team2[0] || ''}
                        onChange={(e) => updateScore(hole, 2, e.target.value)}
                        placeholder="Score"
                        className="w-14 px-2 py-1 border-2 border-orange-200 rounded text-center text-lg"
                      />
                    </div>
                  </div>

                  <div>
                    <div className="flex items-center justify-between">
                      <div className="flex-1">
                        <strong>{mp.team2[1].name}</strong> ({mp.team2[1].hcp})
                        {playersWithStroke[3] && (
                          <div className="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded mt-1 inline-block ml-2">
                            +1 stroke
                          </div>
                        )}
                      </div>
                      <input
                        type="number"
                        value={mp.scores[hole].team2[1] || ''}
                        onChange={(e) => updateScore(hole, 3, e.target.value)}
                        placeholder="Score"
                        className="w-14 px-2 py-1 border-2 border-orange-200 rounded text-center text-lg"
                      />
                    </div>
                  </div>
                </div>

                <div className="flex gap-2 mb-3">
                  <button
                    onClick={previousHole}
                    className="flex-1 px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-semibold hover:bg-gray-300"
                  >
                    ← Prev
                  </button>
                  <button
                    onClick={nextHole}
                    className="flex-1 px-4 py-2 bg-green-600 text-white rounded-lg font-semibold hover:bg-green-700"
                  >
                    Next →
                  </button>
                </div>

                <div className="bg-green-50 rounded-lg p-3">
                  <h3 className="font-bold text-green-800 mb-2">Match Status</h3>
                  <div className="space-y-1 text-sm">
                    <div className="flex justify-between">
                      <span>Front 9:</span>
                      <span className="font-semibold">
                        Team 1: {status.frontTeam1} | Team 2: {status.frontTeam2}
                      </span>
                    </div>
                    <div className="flex justify-between">
                      <span>Back 9:</span>
                      <span className="font-semibold">
                        Team 1: {status.backTeam1} | Team 2: {status.backTeam2}
                      </span>
                    </div>
                    <div className="flex justify-between">
                      <span>Total 18:</span>
                      <span className="font-semibold">
                        Team 1: {status.totalTeam1} | Team 2: {status.totalTeam2}
                      </span>
                    </div>
                  </div>
                </div>
              </div>
            );
          };

          const renderScorecard = () => {
            const mp = gameState.matchPlay;
            const allPlayers = [...mp.team1, ...mp.team2];
            const lowestHcp = Math.min(...allPlayers.map(p => p.hcp));

            return (
              <div className="p-4 max-w-4xl mx-auto">
                <button 
                  onClick={() => setScreen('scoring')}
                  className="mb-4 px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300"
                >
                  ← Back to Scoring
                </button>

                    <p className="text-xs text-gray-600 mt-1">Par for each hole 1-18 (e.g., 4,4,3,5...)</p>
                  </div>
                  <button
                    onClick={addCourse}
                    className="w-full px-4 py-2 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700"
                  >
                    Add Course
                  </button>
                </div>

                <div className="bg-green-50 rounded-lg p-4">
                  <h3 className="font-bold text-green-800 mb-3">Saved Courses ({savedCourses.length})</h3>
                  {savedCourses.length === 0 ? (
                    <p className="text-gray-600 text-center py-4">No courses saved yet</p>
                  ) : (
                    <div className="space-y-2">
                      {savedCourses.map(course => (
                        <div key={course.name} className="flex justify-between items-center bg-white p-3 rounded border border-green-200">
                          <div className="flex-1">
                            <span className="font-semibold">{course.name}</span>
                            <div className="text-xs text-gray-600 mt-1">Handicaps: {course.holeHandicaps.join(', ')}</div>
                            {course.pars && <div className="text-xs text-gray-600">Pars: {course.pars.join(', ')}</div>}
                          </div>
                          <button
                            onClick={() => deleteCourse(course.name)}
                            className="px-3 py-1 bg-red-500 text-white rounded text-sm hover:bg-red-600"
                          >
                            Delete
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            );
          }

          if (screen === 'setup') {
            return (
              <div className="p-4 max-w-2xl mx-auto">
                <button
                  onClick={() => setScreen('home')}
                  className="mb-4 px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300"
                >
                  ← Back
                </button>
                
                <h1 className="text-2xl font-bold text-green-800 text-center mb-4">Match Play Setup</h1>
                
                <div className="bg-green-50 rounded-lg p-4 mb-3">
                  <h3 className="font-bold text-green-800 mb-2">Team 1</h3>
                  
                  {/* Player 1 */}
                  <div className="mb-2">
                    <label className="block mb-1 text-xs font-semibold text-green-700">Player 1</label>
                    <select
                      value={setupData.team1player1 || '__new__'}
                      onChange={(e) => handlePlayerSelect('team1player1', 'team1player1hcp', e.target.value)}
                      className="w-full px-2 py-2 border-2 border-green-200 rounded text-sm mb-1"
                    >
                      <option value="__new__">+ Add New Player</option>
                      {savedPlayers.map(p => (
                        <option key={p.name} value={p.name}>{p.name} ({p.hcp})</option>
                      ))}
                    </select>
                    {(setupData.team1player1 === '' || !savedPlayers.find(p => p.name === setupData.team1player1)) && (
                      <div className="grid grid-cols-2 gap-2">
                        <input
                          type="text"
                          value={setupData.team1player1}
                          onChange={(e) => setSetupData({...setupData, team1player1: e.target.value})}
                          placeholder="Player Name"
                          className="px-2 py-2 border-2 border-green-200 rounded text-sm"
                        />
                        <input
                          type="number"
                          value={setupData.team1player1hcp}
                          onChange={(e) => setSetupData({...setupData, team1player1hcp: e.target.value})}
                          placeholder="HCP"
                          step="0.1"
                          className="px-2 py-2 border-2 border-green-200 rounded text-sm"
                        />
                      </div>
                    )}
                    {setupData.team1player1 && savedPlayers.find(p => p.name === setupData.team1player1) && (
                      <input
                        type="number"
                        value={setupData.team1player1hcp}
                        onChange={(e) => setSetupData({...setupData, team1player1hcp: e.target.value})}
                        placeholder="Update HCP"
                        step="0.1"
                        className="w-full px-2 py-2 border-2 border-green-200 rounded text-sm"
                      />
                    )}
                  </div>

                  {/* Player 2 */}
                  <div className="mb-2">
                    <label className="block mb-1 text-xs font-semibold text-green-700">Player 2</label>
                    <select
                      value={setupData.team1player2 || '__new__'}
                      onChange={(e) => handlePlayerSelect('team1player2', 'team1player2hcp', e.target.value)}
                      className="w-full px-2 py-2 border-2 border-green-200 rounded text-sm mb-1"
                    >
                      <option value="__new__">+ Add New Player</option>
                      {savedPlayers.map(p => (
                        <option key={p.name} value={p.name}>{p.name} ({p.hcp})</option>
                      ))}
                    </select>
                    {(setupData.team1player2 === '' || !savedPlayers.find(p => p.name === setupData.team1player2)) && (
                      <div className="grid grid-cols-2 gap-2">
                        <input
                          type="text"
                          value={setupData.team1player2}
                          onChange={(e) => setSetupData({...setupData, team1player2: e.target.value})}
                          placeholder="Player Name"
                          className="px-2 py-2 border-2 border-green-200 rounded text-sm"
                        />
                        <input
                          type="number"
                          value={setupData.team1player2hcp}
                          onChange={(e) => setSetupData({...setupData, team1player2hcp: e.target.value})}
                          placeholder="HCP"
                          step="0.1"
                          className="px-2 py-2 border-2 border-green-200 rounded text-sm"
                        />
                      </div>
                    )}
                    {setupData.team1player2 && savedPlayers.find(p => p.name === setupData.team1player2) && (
                      <input
                        type="number"
                        value={setupData.team1player2hcp}
                        onChange={(e) => setSetupData({...setupData, team1player2hcp: e.target.value})}
                        placeholder="Update HCP"
                        step="0.1"
                        className="w-full px-2 py-2 border-2 border-green-200 rounded text-sm"
                      />
                    )}
                  </div>
                </div>

                <div className="bg-orange-50 rounded-lg p-4 mb-3">
                  <h3 className="font-bold text-orange-800 mb-2">Team 2</h3>
                  
                  {/* Player 1 */}
                  <div className="mb-2">
                    <label className="block mb-1 text-xs font-semibold text-orange-700">Player 1</label>
                    <select
                      value={setupData.team2player1 || '__new__'}
                      onChange={(e) => handlePlayerSelect('team2player1', 'team2player1hcp', e.target.value)}
                      className="w-full px-2 py-2 border-2 border-orange-200 rounded text-sm mb-1"
                    >
                      <option value="__new__">+ Add New Player</option>
                      {savedPlayers.map(p => (
                        <option key={p.name} value={p.name}>{p.name} ({p.hcp})</option>
                      ))}
                    </select>
                    {(setupData.team2player1 === '' || !savedPlayers.find(p => p.name === setupData.team2player1)) && (
                      <div className="grid grid-cols-2 gap-2">
                        <input
                          type="text"
                          value={setupData.team2player1}
                          onChange={(e) => setSetupData({...setupData, team2player1: e.target.value})}
                          placeholder="Player Name"
                          className="px-2 py-2 border-2 border-orange-200 rounded text-sm"
                        />
                        <input
                          type="number"
                          value={setupData.team2player1hcp}
                          onChange={(e) => setSetupData({...setupData, team2player1hcp: e.target.value})}
                          placeholder="HCP"
                          step="0.1"
                          className="px-2 py-2 border-2 border-orange-200 rounded text-sm"
                        />
                      </div>
                    )}
                    {setupData.team2player1 && savedPlayers.find(p => p.name === setupData.team2player1) && (
                      <input
                        type="number"
                        value={setupData.team2player1hcp}
                        onChange={(e) => setSetupData({...setupData, team2player1hcp: e.target.value})}
                        placeholder="Update HCP"
                        step="0.1"
                        className="w-full px-2 py-2 border-2 border-orange-200 rounded text-sm"
                      />
                    )}
                  </div>

                  {/* Player 2 */}
                  <div className="mb-2">
                    <label className="block mb-1 text-xs font-semibold text-orange-700">Player 2</label>
                    <select
                      value={setupData.team2player2 || '__new__'}
                      onChange={(e) => handlePlayerSelect('team2player2', 'team2player2hcp', e.target.value)}
                      className="w-full px-2 py-2 border-2 border-orange-200 rounded text-sm mb-1"
                    >
                      <option value="__new__">+ Add New Player</option>
                      {savedPlayers.map(p => (
                        <option key={p.name} value={p.name}>{p.name} ({p.hcp})</option>
                      ))}
                    </select>
                    {(setupData.team2player2 === '' || !savedPlayers.find(p => p.name === setupData.team2player2)) && (
                      <div className="grid grid-cols-2 gap-2">
                        <input
                          type="text"
                          value={setupData.team2player2}
                          onChange={(e) => setSetupData({...setupData, team2player2: e.target.value})}
                          placeholder="Player Name"
                          className="px-2 py-2 border-2 border-orange-200 rounded text-sm"
                        />
                        <input
                          type="number"
                          value={setupData.team2player2hcp}
                          onChange={(e) => setSetupData({...setupData, team2player2hcp: e.target.value})}
                          placeholder="HCP"
                          step="0.1"
                          className="px-2 py-2 border-2 border-orange-200 rounded text-sm"
                        />
                      </div>
                    )}
                    {setupData.team2player2 && savedPlayers.find(p => p.name === setupData.team2player2) && (
                      <input
                        type="number"
                        value={setupData.team2player2hcp}
                        onChange={(e) => setSetupData({...setupData, team2player2hcp: e.target.value})}
                        placeholder="Update HCP"
                        step="0.1"
                        className="w-full px-2 py-2 border-2 border-orange-200 rounded text-sm"
                      />
                    )}
                  </div>
                </div>

                <h2 className="text-lg font-bold text-green-800 mb-2">Bet Amounts</h2>
                <div className="grid grid-cols-3 gap-2 mb-3">
                  <div>
                    <label className="block mb-1 text-xs font-semibold text-green-700">Front 9</label>
                    <input
                      type="number"
                      value={setupData.betFront}
                      onChange={(e) => setSetupData({...setupData, betFront: e.target.value})}
                      className="w-full px-2 py-2 border-2 border-green-200 rounded text-sm"
                    />
                  </div>
                  <div>
                    <label className="block mb-1 text-xs font-semibold text-green-700">Back 9</label>
                    <input
                      type="number"
                      value={setupData.betBack}
                      onChange={(e) => setSetupData({...setupData, betBack: e.target.value})}
                      className="w-full px-2 py-2 border-2 border-green-200 rounded text-sm"
                    />
                  </div>
                  <div>
                    <label className="block mb-1 text-xs font-semibold text-green-700">Total 18</label>
                    <input
                      type="number"
                      value={setupData.betTotal}
                      onChange={(e) => setSetupData({...setupData, betTotal: e.target.value})}
                      className="w-full px-2 py-2 border-2 border-green-200 rounded text-sm"
                    />
                  </div>
                </div>

                <h2 className="text-lg font-bold text-green-800 mb-2">Course</h2>
                <div className="mb-2">
                  <label className="block mb-1 text-xs font-semibold text-green-700">Select Course</label>
                  <select
                    value={setupData.courseName || '__new__'}
                    onChange={(e) => handleCourseSelect(e.target.value)}
                    className="w-full px-2 py-2 border-2 border-green-200 rounded text-sm mb-1"
                  >
                    <option value="__new__">+ Add New Course</option>
                    {savedCourses.map(c => (
                      <option key={c.name} value={c.name}>{c.name}</option>
                    ))}
                  </select>
                  {(setupData.courseName === '' || !savedCourses.find(c => c.name === setupData.courseName)) && (
                    <input
                      type="text"
                      value={setupData.courseName}
                      onChange={(e) => setSetupData({...setupData, courseName: e.target.value})}
                      placeholder="Course Name"
                      className="w-full px-2 py-2 border-2 border-green-200 rounded text-sm mb-2"
                    />
                  )}
                </div>
                <div className="mb-3">
                  <label className="block mb-1 text-xs font-semibold text-green-700">
                    Hole Handicaps (stroke index, comma separated)
                  </label>
                  <input
                    type="text"
                    value={setupData.holeHandicaps}
                    onChange={(e) => setSetupData({...setupData, holeHandicaps: e.target.value})}
                    className="w-full px-2 py-2 border-2 border-green-200 rounded text-sm mb-2"
                  />
                  <p className="text-xs text-gray-600 mb-2">From the scorecard stroke index for each hole 1-18</p>
                  
                  <label className="block mb-1 text-xs font-semibold text-green-700">
                    Hole Pars (comma separated)
                  </label>
                  <input
                    type="text"
                    value={setupData.holePars}
                    onChange={(e) => setSetupData({...setupData, holePars: e.target.value})}
                    className="w-full px-2 py-2 border-2 border-green-200 rounded text-sm"
                  />
                  <p className="text-xs text-gray-600 mt-1">Par for each hole 1-18 (e.g., 4,4,3,5...)</p>
                </div>

                <button
                  onClick={startMatchPlay}
                  className="w-full px-4 py-3 bg-green-600 text-white rounded-lg font-semibold text-lg hover:bg-green-700"
                >
                  Start Round
                </button>
              </div>
            );
          }

          if (screen === 'scoring') {
            return renderScoring();
          }

          if (screen === 'scorecard') {
            return renderScorecard();
          }

          if (screen === 'results') {
            return renderResults();
          }

          return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GolfBetTracker />);
    </script>
</body>
</html>
